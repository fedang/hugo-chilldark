{{ $pname := .Get 0 }}
{{ $name := printf "icons/%s.svg" (.Get 0) }}
{{ $image := resources.Get $name }}
{{ $size := .Get 1 | default `small` }}
{{- with $image -}}
<span class="icon icon-{{ $size }} icon-invert" role="img" aria-label="{{ title $pname }} icon">
  {{ .Content | safeHTML }}
</span>
{{- end -}}
