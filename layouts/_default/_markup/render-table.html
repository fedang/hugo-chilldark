<div class="table-scroll">
  <table{{ with .Attributes }}{{ range $k, $v := . }} {{ $k }}="{{ $v }}"{{ end }}{{ end }}>
    {{ with .THead }}
      <thead>
        {{ range . }}
          <tr>
            {{ range . }}
              <th style="text-align:{{ .Alignment }};">{{ .Text | safeHTML }}</th>
            {{ end }}
          </tr>
        {{ end }}
      </thead>
    {{ end }}
    {{ with .TBody }}
      <tbody>
        {{ range . }}
          <tr>
            {{ range . }}
              <td style="text-align:{{ .Alignment }};">{{ .Text | safeHTML }}</td>
            {{ end }}
          </tr>
        {{ end }}
      </tbody>
    {{ end }}
  </table>
</div>
